# Checks every pull request and every push to main: the code is formatted,
# tidy, vetted and linted, the tests pass with the race detector against a
# fake DNS API, the image builds for every platform it is released for
# (without pushing it), and the Helm values example renders with the
# external-dns chart.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: 'actions/checkout@v4'

      - name: Go
        uses: 'actions/setup-go@v5'
        with:
          go-version-file: go.mod

      - name: Formatting and modules
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "not gofmt-formatted:"; echo "${unformatted}"; exit 1
          fi
          go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Tests
        run: go test -race ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: 'actions/checkout@v4'

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  helm:
    runs-on: ubuntu-latest
    env:
      # The external-dns chart the example is written for.
      CHART_VERSION: '1.23.0'
    steps:
      - name: Checkout
        uses: 'actions/checkout@v4'

      - name: Helm values example
        run: |
          helm template external-dns external-dns \
            --repo https://kubernetes-sigs.github.io/external-dns/ \
            --version "${CHART_VERSION}" \
            --values examples/helm/values.yaml > /dev/null
