# Values for the external-dns chart (https://kubernetes-sigs.github.io/external-dns/,
# chart 1.23 or later) that run this webhook as the provider: a sidecar in
# external-dns's pod. external-dns calls it at http://localhost:8888; the
# kubelet probes it on port 8080.
#
# The webhook acts as a WORKLOAD service account with roles/dns.editor on the
# project, through a federated credential that trusts the cluster's issuer
# for sub=system:serviceaccount:<namespace>:external-dns. No secret is stored
# in the cluster.
#
#   helm upgrade --install external-dns external-dns \
#     --repo https://kubernetes-sigs.github.io/external-dns/ \
#     --values values.yaml

# Owns the records this cluster creates. Every cluster that shares a zone
# needs its own.
txtOwnerId: my-cluster

# sync deletes the records of deleted Services and Ingresses; upsert-only
# never deletes.
policy: sync

sources:
  - service
  - ingress

# With `namespaced: true` (one namespace, a Role instead of a ClusterRole),
# also set `extraArgs: [--service-type-filter=ClusterIP,LoadBalancer]`:
# the chart then grants no access to Nodes, and external-dns waits for a
# Node informer it can't fill unless NodePort services are filtered out.

# The domains external-dns manages. Keep them the same as the webhook's
# DOMAIN_FILTER.
domainFilters:
  - example.com

provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/origincloudhq/external-dns-origincloud-webhook
      tag: "0.2.0"
    env:
      - name: ORIGINCLOUD_PROJECT
        value: my-project-123
      - name: DOMAIN_FILTER
        value: example.com
      # The projected token below, exchanged at the security token service
      # for the service account's access tokens, read again at each exchange.
      - name: ORIGINCLOUD_OIDC_TOKEN_FILE
        value: /var/run/secrets/origincloud/token
    extraVolumeMounts:
      - name: origincloud-token
        mountPath: /var/run/secrets/origincloud
        readOnly: true
    livenessProbe:
      httpGet:
        path: /healthz
        port: http-webhook
    readinessProbe:
      httpGet:
        path: /readyz
        port: http-webhook
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# The cluster's token for external-dns's Kubernetes service account, issued
# for the security token service and renewed by the kubelet before it expires.
extraVolumes:
  - name: origincloud-token
    projected:
      sources:
        - serviceAccountToken:
            audience: https://sts.origincloudapis.eu
            expirationSeconds: 3600
            path: token
